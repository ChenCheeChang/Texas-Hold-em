<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皇家德州撲克</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --aqua: #5CD6D6;
      --gold: #F5C451;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', 'Noto Sans TC', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 45%, #102430 0%, #070d14 78%);
      color: #eef6f9;
      height: 100dvh;
      max-height: 100dvh;
      width: 100vw;
      margin: 0;
      overflow: hidden;
      user-select: none;
    }
    .felt-table {
      background: radial-gradient(ellipse at center, #136148 0%, #0c4432 64%, #06281d 100%);
      box-shadow:
        inset 0 0 36px rgba(0, 0, 0, 0.72),
        0 0 0 6px #3a2314,
        0 0 0 9px #c79a42,
        0 16px 40px rgba(0, 0, 0, 0.85);
    }
    .orbit-ring {
      position: absolute;
      border-radius: 9999px;
      border: 1.5px dashed rgba(92, 214, 214, 0.22);
      pointer-events: none;
      z-index: 1;
    }
    .poker-card {
      width: clamp(26px, 3.6vw, 44px);
      height: clamp(38px, 5.1vw, 62px);
      border-radius: 5px;
      background: #ffffff;
      color: #111827;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.55);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .poker-card.lg {
      width: clamp(28px, 3.8vw, 48px);
      height: clamp(40px, 5.4vw, 68px);
      border-radius: 5px;
    }
    .poker-card.sm {
      width: clamp(24px, 3.1vw, 38px);
      height: clamp(34px, 4.4vw, 54px);
      border-radius: 4px;
    }
    .card-back {
      background: linear-gradient(135deg, #16294a 0%, #0d1a30 100%);
      border: 1.5px solid #d4af37;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back::after {
      content: '★';
      color: rgba(212, 175, 55, 0.55);
      font-size: 0.9rem;
    }
    .card-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .suit-badge {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 0.9;
      font-weight: 800;
      padding: 1px 2px;
      border-radius: 2.5px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 1px 2px rgba(0,0,0,0.3);
      z-index: 2;
    }
    .suit-badge.tl { top: 1.5px; left: 1.5px; }
    .suit-badge.br { bottom: 1.5px; right: 1.5px; transform: rotate(180deg); }
    .seat-node {
      background: rgba(11, 20, 31, 0.9);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(92, 214, 214, 0.25);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .seat-node.active-turn {
      border-color: var(--aqua);
      box-shadow: 0 0 20px rgba(92, 214, 214, 0.55);
    }
    .seat-node.winner-glow {
      border-color: var(--gold);
      box-shadow: 0 0 24px rgba(245, 196, 81, 0.75);
    }
    .seat-node.folded {
      opacity: 0.42;
      filter: grayscale(0.6);
    }
    .flying-card {
      position: fixed;
      width: 30px;
      height: 42px;
      border-radius: 4px;
      z-index: 60;
      pointer-events: none;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.65);
    }
    #dealerPuck {
      transition: left 0.35s cubic-bezier(0.22, 1, 0.36, 1), top 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .aqua-btn {
      background: linear-gradient(135deg, #5CD6D6 0%, #2ba8a8 100%);
      color: #06181c;
      font-weight: 700;
    }
    .aqua-btn:hover:not(:disabled) { filter: brightness(1.08); }
    .aqua-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .custom-scroll::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(92, 214, 214, 0.3); border-radius: 999px; }
  </style>
</head>
<body class="flex flex-col h-[100dvh] overflow-hidden">

  <!-- Minimal Header -->
  <header class="w-full px-3 py-1.5 bg-slate-950/85 border-b border-cyan-400/20 flex items-center justify-between gap-2 z-30 shrink-0">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-md bg-gradient-to-br from-cyan-300 to-teal-600 flex items-center justify-center text-slate-950 font-black text-xs shadow">♠</div>
      <h1 class="text-xs sm:text-sm font-extrabold tracking-wide text-white">皇家德州撲克</h1>
    </div>
    <div class="flex items-center gap-1.5">
      <span id="handCounter" class="px-2 py-0.5 rounded bg-slate-800/80 text-[11px] font-bold text-amber-300 border border-slate-700">第 1 局</span>
      <button id="btnBgm" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-cyan-300 border border-cyan-500/30 transition">🎵 音樂</button>
      <button id="btnSound" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-200 border border-slate-700 transition">🔊 音效</button>
      <button id="btnRules" class="px-2 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-200 border border-slate-700 transition">牌型說明</button>
      <button id="btnNewTable" class="px-2.5 py-1 rounded-lg aqua-btn text-[11px] shadow transition">重新開局</button>
    </div>
  </header>

  <!-- Full-Screen 5-Player Circular Table Arena -->
  <main class="flex-1 flex flex-col justify-between p-1.5 sm:p-2 overflow-hidden w-full max-w-6xl mx-auto min-h-0 gap-1">

    <!-- Circular Arena: Round Table + 5 Surrounding Seats + Dealer Puck -->
    <div id="tableArena" class="flex-1 min-h-0 relative w-full overflow-hidden">

      <!-- Circular Orbit Ring -->
      <div id="orbitRing" class="orbit-ring"></div>

      <!-- Center Small Round Felt Table -->
      <div id="feltCircle" class="felt-table rounded-full absolute flex flex-col items-center justify-center gap-1.5 p-2 z-0">
        <div class="flex items-center gap-1.5 text-[10px] sm:text-xs font-bold">
          <div id="deckOrigin" class="w-5 h-7 rounded card-back border border-amber-400 shadow-md shrink-0"></div>
          <span id="potBadge" class="px-2.5 py-0.5 rounded-full bg-black/55 text-amber-300 border border-amber-400/40 shadow">$0</span>
        </div>

        <!-- 5 Community Cards -->
        <div id="communityCards" class="flex items-center justify-center gap-0.5 sm:gap-1"></div>

        <!-- Showdown Winner & Profit/Loss Banner -->
        <div id="showdownBanner" class="hidden text-center text-[10px] sm:text-xs font-extrabold text-amber-200 bg-black/70 px-2.5 py-0.5 rounded-full border border-amber-400/50 max-w-[95%] truncate shadow"></div>
      </div>

      <!-- Floating Dealer Puck on Table Rim -->
      <div id="dealerPuck" class="absolute w-6 h-6 rounded-full bg-amber-400 text-slate-950 font-black text-[11px] flex items-center justify-center shadow-lg ring-2 ring-white z-20 pointer-events-none">D</div>

      <!-- 5 Seats Around the Round Table -->
      <div id="seat-0" class="seat-node rounded-xl p-1.5 absolute z-20"></div>
      <div id="seat-1" class="seat-node rounded-xl p-1.5 absolute z-10"></div>
      <div id="seat-2" class="seat-node rounded-xl p-1.5 absolute z-10"></div>
      <div id="seat-3" class="seat-node rounded-xl p-1.5 absolute z-10"></div>
      <div id="seat-4" class="seat-node rounded-xl p-1.5 absolute z-10"></div>
    </div>

    <!-- Flying Card Layer -->
    <div id="flyLayer" class="fixed inset-0 pointer-events-none z-50"></div>

    <!-- Bottom Controls Panel -->
    <div id="controlsPanel" class="w-full max-w-2xl mx-auto bg-slate-900/95 border border-slate-700/80 rounded-2xl p-2 flex flex-col gap-1.5 shadow-2xl z-20 shrink-0">
      <div class="flex flex-wrap items-center justify-between gap-1.5">
        <div class="flex items-center gap-1.5 flex-wrap">
          <button id="btnFold" class="px-3.5 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 disabled:opacity-35 text-white font-bold text-xs transition">棄牌</button>
          <button id="btnCheckCall" class="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 disabled:opacity-35 text-white font-bold text-xs transition">過牌</button>
          <button id="btnRaise" class="px-3.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-35 text-slate-950 font-extrabold text-xs transition">加注</button>
        </div>

        <!-- Raise Slider & Presets -->
        <div id="raiseBox" class="flex flex-wrap items-center gap-1.5 flex-1 justify-end min-w-[210px]">
          <input id="raiseSlider" type="range" min="100" max="10000" step="50" value="200" class="w-24 sm:w-32 accent-cyan-400 cursor-pointer" />
          <span id="raiseAmountText" class="text-xs font-bold text-amber-300 w-12 text-right">$200</span>
          <div class="flex items-center gap-1">
            <button data-preset="min" class="preset-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-200">最小</button>
            <button data-preset="half" class="preset-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-200">1/2池</button>
            <button data-preset="pot" class="preset-btn px-1.5 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-[10px] text-slate-200">滿池</button>
            <button data-preset="allin" class="preset-btn px-1.5 py-0.5 rounded bg-rose-900/70 hover:bg-rose-800 text-[10px] text-rose-200">All-In</button>
          </div>
        </div>
      </div>

      <!-- Next Hand / Rebuy Bar -->
      <div id="nextHandBar" class="hidden flex items-center justify-center gap-3 pt-1 border-t border-slate-800">
        <button id="btnNextHand" class="px-5 py-1.5 rounded-xl aqua-btn text-xs shadow-lg transition">下一局</button>
        <button id="btnRebuy" class="hidden px-4 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow transition">補充籌碼 ($10,000)</button>
      </div>
    </div>
  </main>

  <!-- Opening Splash / Home Screen -->
  <div id="homeScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-4 bg-slate-950/95 backdrop-blur-md">
    <div class="max-w-lg w-full bg-slate-900/90 border border-cyan-400/35 rounded-3xl p-6 sm:p-8 flex flex-col items-center text-center shadow-2xl relative overflow-hidden">
      <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/30 text-cyan-300 text-xs font-bold mb-3">
        <span>♠ ♥ ♦ ♣</span>
        <span>全屏 5 人圓桌德州撲克</span>
      </div>
      <h2 class="text-2xl sm:text-3xl font-black tracking-wide text-white mb-1">皇家德州撲克</h2>
      <p class="text-xs sm:text-sm text-slate-300 mb-5">川普 K • 習近平 Q • 普丁 J • 經典斯洛克 Lounge 爵士配樂</p>

      <!-- Featured K / Q / J Card Art Preview -->
      <div class="flex items-center justify-center gap-3 sm:gap-4 mb-6">
        <div class="flex flex-col items-center gap-1">
          <div class="w-16 h-24 sm:w-20 sm:h-28 rounded-xl overflow-hidden border-2 border-amber-400 shadow-lg relative bg-white">

    { id: 'D', sym: '♦', color: '#dc2626' },
    { id: 'C', sym: '♣', color: '#111827' }
  ];

  const RANKS = [
    { val: 2, label: '2' }, { val: 3, label: '3' }, { val: 4, label: '4' },
    { val: 5, label: '5' }, { val: 6, label: '6' }, { val: 7, label: '7' },
    { val: 8, label: '8' }, { val: 9, label: '9' }, { val: 10, label: '10' },
    { val: 11, label: 'J' }, { val: 12, label: 'Q' }, { val: 13, label: 'K' },
    { val: 14, label: 'A' }
  ];

  const HAND_NAMES = [
    '高牌', '一對', '兩對', '三條', '順子',
    '同花', '葫蘆', '四條', '同花順', '皇家同花順'
  ];

  const AI_NAMES = ['艾倫', '貝拉', '卡爾', '黛娜'];
  const SB_AMOUNT = 50;
  const BB_AMOUNT = 100;
  const STARTING_CHIPS = 10000;

  let soundEnabled = true;
  let bgmEnabled = true;
  let audioCtx = null;
  let bgmTimer = null;
  let bgmStep = 0;

  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, dur = 0.08, type = 'sine', gainVal = 0.06) {
    if (!soundEnabled) return;
    try {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch (_) {}
  }

  // Relaxing Snooker Lounge Rhodes & Walking Bass BGM
  const SNOOKER_PROGRESSION = [
    // Dm9 -> G13 -> Cmaj9 -> A7alt (classic chill snooker lounge jazz)
    { bass: 73.42, chord: [293.66, 349.23, 440.00, 523.25], melody: [587.33, 523.25, 440.00, 392.00] },
    { bass: 98.00, chord: [246.94, 349.23, 440.00, 523.25], melody: [493.88, 440.00, 392.00, 349.23] },
    { bass: 65.41, chord: [261.63, 329.63, 392.00, 493.88], melody: [523.25, 493.88, 392.00, 329.63] },
    { bass: 110.00, chord: [277.18, 349.23, 415.30, 523.25], melody: [440.00, 392.00, 349.23, 329.63] }
  ];

  function playWarmNote(freq, dur, vol, type = 'sine') {
    if (!bgmEnabled || !audioCtx) return;
    try {
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(950, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(vol, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);
    } catch (_) {}
  }

  function startSnookerBgm() {
    if (bgmTimer) clearInterval(bgmTimer);
    ensureAudio();
    bgmTimer = setInterval(() => {
      if (!bgmEnabled || !audioCtx || audioCtx.state !== 'running') return;
      const bar = SNOOKER_PROGRESSION[Math.floor(bgmStep / 4) % SNOOKER_PROGRESSION.length];
      const beat = bgmStep % 4;
      // Soft upright walking bass on every beat
      const bassMult = beat === 0 ? 1 : beat === 2 ? 1.5 : 1.25;
      playWarmNote(bar.bass * bassMult, 0.55, 0.032, 'triangle');
      // Warm Rhodes chord pad on beat 0 and gentle syncopation on beat 2
      if (beat === 0) {
        bar.chord.forEach(f => playWarmNote(f, 1.45, 0.014, 'sine'));
      } else if (beat === 2) {
        bar.chord.forEach(f => playWarmNote(f, 0.85, 0.01, 'sine'));
      }
      // Gentle vibraphone/piano lounge note
      if (beat === 1 || beat === 3) {
        const note = bar.melody[(bgmStep + beat) % bar.melody.length];
        playWarmNote(note, 0.65, 0.015, 'sine');
      }
      bgmStep++;
    }, 620);
  }
  const sfx = {
    deal: () => playTone(520, 0.05, 'triangle', 0.05),
    chip: () => { playTone(1100, 0.05, 'sine', 0.05); setTimeout(() => playTone(1450, 0.06, 'sine', 0.04), 45); },
    check: () => playTone(260, 0.06, 'triangle', 0.05),
    fold: () => playTone(180, 0.09, 'sawtooth', 0.03),
    win: () => { playTone(523, 0.1, 'triangle', 0.07); setTimeout(() => playTone(659, 0.1, 'triangle', 0.07), 90); setTimeout(() => playTone(784, 0.2, 'triangle', 0.08), 180); }
  };

  let state = {
    players: [],
    deck: [],
    community: [],
    pot: 0,
    dealerIndex: 0,
    turnIndex: -1,
    street: 'preflop',
    currentBet: 0,
    minRaise: BB_AMOUNT,
    handNumber: 0,
    phase: 'idle',
    winnerIds: new Set(),
    aiTimer: null,
    dealSessionId: 0
  };

  const $ = (id) => document.getElementById(id);

  function createDeck() {
    const d = [];
    for (const s of SUITS) {
      for (const r of RANKS) {
        d.push({ suit: s.id, sym: s.sym, color: s.color, rank: r.val, label: r.label, id: `${s.id}${r.val}` });
      }
    }
    for (let i = d.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [d[i], d[j]] = [d[j], d[i]];
    }
    return d;
  }

  function cardHTML(card, size = 'sm', faceDown = false) {
    if (faceDown) {
      return `<div class="poker-card ${size} card-back"></div>`;
    }
    const art = FACE_ART[card.rank];
    if (art) {
      return `
        <div class="poker-card ${size}">
          <img src="${art}" alt="${card.label}" class="card-art-img" />
          <div class="suit-badge tl" style="color:${card.color}; font-size:7px">
            <span>${card.label}</span><span style="font-size:6.5px">${card.sym}</span>
          </div>
          <div class="suit-badge br" style="color:${card.color}; font-size:7px">
            <span>${card.label}</span><span style="font-size:6.5px">${card.sym}</span>
          </div>
        </div>
      `;
    }
    const fontSize = size === 'lg' ? 'text-[10px]' : 'text-[9px]';
    const centerSize = size === 'lg' ? 'text-sm' : 'text-xs';
    return `
      <div class="poker-card ${size} flex flex-col justify-between p-1 border border-slate-300" style="color:${card.color}">
        <div class="flex flex-col items-center leading-none self-start font-extrabold ${fontSize}">
          <span>${card.label}</span>
          <span class="text-[6.5px]">${card.sym}</span>
        </div>
        <div class="self-center leading-none ${centerSize}">${card.sym}</div>
        <div class="flex flex-col items-center leading-none self-end rotate-180 font-extrabold ${fontSize}">
          <span>${card.label}</span>
          <span class="text-[6.5px]">${card.sym}</span>
        </div>
      </div>
    `;
  }

  // ===== 7-Card Texas Hold'em Evaluator =====
  function eval5(cards) {
    const ranks = cards.map(c => c.rank).sort((a, b) => b - a);
    const isFlush = cards.every(c => c.suit === cards[0].suit);
    const counts = {};
    for (const r of ranks) counts[r] = (counts[r] || 0) + 1;
    const groups = Object.entries(counts)
      .map(([r, cnt]) => ({ r: Number(r), cnt }))
      .sort((a, b) => b.cnt - a.cnt || b.r - a.r);

    let isStraight = false;
    let straightHigh = 0;
    if (groups.length === 5) {
      if (ranks[0] - ranks[4] === 4) {
        isStraight = true;
        straightHigh = ranks[0];
      } else if (ranks[0] === 14 && ranks[1] === 5 && ranks[2] === 4 && ranks[3] === 3 && ranks[4] === 2) {
        isStraight = true;
        straightHigh = 5;
      }
    }

    if (isFlush && isStraight) return straightHigh === 14 ? [9, 14] : [8, straightHigh];
    if (groups[0].cnt === 4) return [7, groups[0].r, groups[1].r];
    if (groups[0].cnt === 3 && groups[1].cnt === 2) return [6, groups[0].r, groups[1].r];
    if (isFlush) return [5, ...ranks];
    if (isStraight) return [4, straightHigh];
    if (groups[0].cnt === 3) return [3, groups[0].r, groups[1].r, groups[2].r];
    if (groups[0].cnt === 2 && groups[1].cnt === 2) return [2, groups[0].r, groups[1].r, groups[2].r];
    if (groups[0].cnt === 2) return [1, groups[0].r, groups[1].r, groups[2].r, groups[3].r];
    return [0, ...ranks];
  }

  function compareScores(a, b) {
    const len = Math.max(a.length, b.length);
    for (let i = 0; i < len; i++) {
      const av = a[i] || 0;
      const bv = b[i] || 0;
      if (av !== bv) return av - bv;
    }
    return 0;
  }

  function evaluateBestHand(cards) {
    if (cards.length < 5) {
      const sorted = [...cards].sort((a, b) => b.rank - a.rank);
      if (sorted.length === 2 && sorted[0].rank === sorted[1].rank) {
        return { score: [1, sorted[0].rank], name: HAND_NAMES[1] };
      }
      return { score: [0, ...(sorted.map(c => c.rank))], name: HAND_NAMES[0] };
    }
    let best = null;
    const n = cards.length;
    for (let i = 0; i < n - 4; i++) {
      for (let j = i + 1; j < n - 3; j++) {
        for (let k = j + 1; k < n - 2; k++) {
          for (let l = k + 1; l < n - 1; l++) {
            for (let m = l + 1; m < n; m++) {
              const s = eval5([cards[i], cards[j], cards[k], cards[l], cards[m]]);
              if (!best || compareScores(s, best) > 0) best = s;
            }
          }
        }
      }
    }
    return { score: best, name: HAND_NAMES[best[0]] };
  }

  // ===== Circular Table Geometry (5 Seats Strictly on a Circle Around Center Table) =====
  function layoutCircularTable() {
    const arena = $('tableArena');
    const felt = $('feltCircle');
    const orbit = $('orbitRing');
    const puck = $('dealerPuck');
    if (!arena || !felt) return;

    const W = arena.clientWidth;
    const H = arena.clientHeight;
    if (W < 50 || H < 50) return;

    const cx = W / 2;
    const cy = H / 2;
    const minDim = Math.min(W, H);

    // Compact uniform seat size so all 5 form a clean circular ring
    const seatW = Math.round(Math.max(88, Math.min(118, minDim * 0.24)));
    const seatH = Math.round(Math.max(58, Math.min(72, minDim * 0.15)));

    const maxRx = (W - seatW - 10) / 2;
    const maxRy = (H - seatH - 10) / 2;
    const ringR = Math.max(66, Math.min(maxRx, maxRy));

    const maxTableDia = Math.max(110, (ringR - seatH * 0.58) * 2);
    const tableDia = Math.round(Math.max(114, Math.min(maxTableDia, minDim * 0.46)));

    felt.style.width = `${tableDia}px`;
    felt.style.height = `${tableDia}px`;
    felt.style.left = `${Math.round(cx - tableDia / 2)}px`;
    felt.style.top = `${Math.round(cy - tableDia / 2)}px`;

    if (orbit) {
      const orbitDia = Math.round(ringR * 2);
      orbit.style.width = `${orbitDia}px`;
      orbit.style.height = `${orbitDia}px`;
      orbit.style.left = `${Math.round(cx - ringR)}px`;
      orbit.style.top = `${Math.round(cy - ringR)}px`;
    }

    // 5 players evenly spaced at 72-degree intervals around the center table
    const anglesDeg = [90, 162, 234, 306, 18];
    anglesDeg.forEach((deg, idx) => {
      const seat = $(`seat-${idx}`);
      if (!seat) return;
      const rad = (deg * Math.PI) / 180;
      const sx = cx + ringR * Math.cos(rad) - seatW / 2;
      const sy = cy + ringR * Math.sin(rad) - seatH / 2;
      seat.style.width = `${seatW}px`;
      seat.style.left = `${Math.round(sx)}px`;
      seat.style.top = `${Math.round(sy)}px`;
    });

    // Dealer puck sits on the rim of the round table facing the dealer seat
    if (puck) {
      const dRad = (anglesDeg[state.dealerIndex] * Math.PI) / 180;
      const puckR = tableDia * 0.45;
      const px = cx + puckR * Math.cos(dRad) - 12;
      const py = cy + puckR * Math.sin(dRad) - 12;
      puck.style.left = `${Math.round(px)}px`;
      puck.style.top = `${Math.round(py)}px`;
    }
  }

  function animateFlyCard(targetEl, sessionId, onArrive) {
    const origin = $('deckOrigin');
    const layer = $('flyLayer');
    if (!origin || !targetEl || !layer) {
      if (sessionId === state.dealSessionId) onArrive();
      return;
    }
    const start = origin.getBoundingClientRect();
    const end = targetEl.getBoundingClientRect();
    const card = document.createElement('div');
    card.className = 'flying-card card-back';
    card.style.left = `${start.left}px`;
    card.style.top = `${start.top}px`;
    layer.appendChild(card);

    const dx = (end.left + end.width / 2 - 15) - start.left;
    const dy = (end.top + end.height / 2 - 21) - start.top;
    const rot = (Math.random() * 18 - 9).toFixed(1);

    sfx.deal();
    const anim = card.animate(
      [
        { transform: 'translate(0px, 0px) scale(0.75) rotate(-10deg)', opacity: 0.95 },
        { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 16}px) scale(1.06) rotate(${rot}deg)`, opacity: 1, offset: 0.5 },
        { transform: `translate(${dx}px, ${dy}px) scale(1) rotate(0deg)`, opacity: 1 }
      ],
      { duration: 340, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
    );

    anim.onfinish = () => {
      card.remove();
      if (sessionId === state.dealSessionId) onArrive();
    };
  }

  // ===== Initialization & Game Loop =====
  function initTable() {
    clearTimeout(state.aiTimer);
    state.players = [
      { id: 0, name: '你', isHuman: true, chips: STARTING_CHIPS },
      { id: 1, name: AI_NAMES[0], isHuman: false, chips: STARTING_CHIPS },
      { id: 2, name: AI_NAMES[1], isHuman: false, chips: STARTING_CHIPS },
      { id: 3, name: AI_NAMES[2], isHuman: false, chips: STARTING_CHIPS },
      { id: 4, name: AI_NAMES[3], isHuman: false, chips: STARTING_CHIPS }
    ].map(p => ({
      ...p,
      cards: [],
      roundBet: 0,
      totalBet: 0,
      netDelta: 0,
      handName: '',
      folded: false,
      allIn: false,
      actedThisStreet: false
    }));
    state.handNumber = 0;
    state.dealerIndex = 0;
    startNewHand();
  }

  function startNewHand() {
    clearTimeout(state.aiTimer);
    state.dealSessionId++;
    const sid = state.dealSessionId;
    if ($('flyLayer')) $('flyLayer').innerHTML = '';

    state.players.forEach(p => {
      if (!p.isHuman && p.chips <= 0) p.chips = STARTING_CHIPS;
    });
    if (state.players[0].chips <= 0) {
      state.phase = 'showdown';
      renderAll();
      return;
    }

    state.handNumber++;
    $('handCounter').textContent = `第 ${state.handNumber} 局`;
    state.deck = createDeck();
    state.community = [];
    state.pot = 0;
    state.street = 'preflop';
    state.currentBet = 0;
    state.minRaise = BB_AMOUNT;
    state.phase = 'dealing';
    state.winnerIds = new Set();
    if ($('showdownBanner')) $('showdownBanner').classList.add('hidden');
    if ($('settlementModal')) {
      $('settlementModal').classList.add('hidden');
      $('settlementModal').classList.remove('flex');
    }

    state.players.forEach(p => {
      p.cards = [];
      p.roundBet = 0;
      p.totalBet = 0;
      p.netDelta = 0;
      p.handName = '';
      p.folded = false;
      p.allIn = false;
      p.actedThisStreet = false;
    });

    state.dealerIndex = (state.handNumber === 1) ? 0 : (state.dealerIndex + 1) % 5;
    const sbIdx = (state.dealerIndex + 1) % 5;
    const bbIdx = (state.dealerIndex + 2) % 5;

    postBlind(sbIdx, SB_AMOUNT);
    postBlind(bbIdx, BB_AMOUNT);
    state.currentBet = Math.max(state.players[sbIdx].roundBet, state.players[bbIdx].roundBet);

    renderAll();

    const dealQueue = [];
    for (let r = 0; r < 2; r++) {
      for (let offset = 1; offset <= 5; offset++) {
        const pid = (state.dealerIndex + offset) % 5;
        dealQueue.push({ pid, card: state.deck.pop() });
      }
    }

    dealQueue.forEach((item, idx) => {
      setTimeout(() => {
        if (sid !== state.dealSessionId) return;
        const targetSeat = $(`seat-${item.pid}`);
        animateFlyCard(targetSeat, sid, () => {
          state.players[item.pid].cards.push(item.card);
          renderSeat(state.players[item.pid]);
          if (idx === dealQueue.length - 1) {
            state.phase = 'betting';
            state.turnIndex = (bbIdx + 1) % 5;
            advanceToValidTurn();
          }
        });
      }, idx * 165);
    });
  }

  function postBlind(idx, amount) {
    const p = state.players[idx];
    const paid = Math.min(p.chips, amount);
    p.chips -= paid;
    p.roundBet += paid;
    p.totalBet += paid;
    state.pot += paid;
    if (p.chips === 0) p.allIn = true;
  }

  function getEligibleToAct() {
    return state.players.filter(p => !p.folded && !p.allIn && p.chips > 0);
  }

  function isStreetComplete() {
    const nonFolded = state.players.filter(p => !p.folded);
    if (nonFolded.length <= 1) return true;
    const eligible = getEligibleToAct();
    if (eligible.length === 0) return true;
    return eligible.every(p => p.actedThisStreet && p.roundBet === state.currentBet);
  }

  function advanceToValidTurn() {
    const nonFolded = state.players.filter(p => !p.folded);
    if (nonFolded.length <= 1) {
      finishHandEarly(nonFolded[0]);
      return;
    }

    if (isStreetComplete()) {
      proceedToNextStreet();
      return;
    }

    let safety = 0;
    while (safety < 6) {
      const p = state.players[state.turnIndex];
      if (!p.folded && !p.allIn && p.chips > 0) break;
      state.turnIndex = (state.turnIndex + 1) % 5;
      safety++;
    }

    renderAll();

    const current = state.players[state.turnIndex];
    if (!current.isHuman && state.phase === 'betting') {
      state.aiTimer = setTimeout(() => runAiTurn(current), 620);
    }
  }

  function proceedToNextStreet() {
    state.players.forEach(p => {
      p.roundBet = 0;
      p.actedThisStreet = false;
    });
    state.currentBet = 0;
    state.minRaise = BB_AMOUNT;

    let newCards = [];
    if (state.street === 'preflop') {
      state.street = 'flop';
      newCards = [state.deck.pop(), state.deck.pop(), state.deck.pop()];
    } else if (state.street === 'flop') {
      state.street = 'turn';
      newCards = [state.deck.pop()];
    } else if (state.street === 'turn') {
      state.street = 'river';
      newCards = [state.deck.pop()];
    } else if (state.street === 'river') {
      runShowdown();
      return;
    }

    state.phase = 'dealing';
    const sid = state.dealSessionId;
    renderAll();

    newCards.forEach((card, idx) => {
      setTimeout(() => {
        if (sid !== state.dealSessionId) return;
        animateFlyCard($('communityCards'), sid, () => {
          state.community.push(card);
          renderAll();
          if (idx === newCards.length - 1) {
            state.phase = 'betting';
            if (getEligibleToAct().length <= 1) {
              renderAll();
              state.aiTimer = setTimeout(() => proceedToNextStreet(), 800);
              return;
            }
            state.turnIndex = (state.dealerIndex + 1) % 5;
            advanceToValidTurn();
          }
        });
      }, idx * 200);
    });
  }

  function commitAction(player, type, raiseToTotal = 0) {
    player.actedThisStreet = true;
    const toCall = Math.max(0, state.currentBet - player.roundBet);

    if (type === 'fold') {
      player.folded = true;
      sfx.fold();
    } else if (type === 'check') {
      sfx.check();
    } else if (type === 'call') {
      const paid = Math.min(player.chips, toCall);
      player.chips -= paid;
      player.roundBet += paid;
      player.totalBet += paid;
      state.pot += paid;
      if (player.chips === 0) player.allIn = true;
      sfx.chip();
    } else if (type === 'raise') {
      const target = Math.min(player.roundBet + player.chips, Math.max(raiseToTotal, state.currentBet + state.minRaise));
      const added = target - player.roundBet;
      player.chips -= added;
      player.roundBet += added;
      player.totalBet += added;
      state.pot += added;

      if (player.roundBet > state.currentBet) {
        const diff = player.roundBet - state.currentBet;
        if (diff > state.minRaise) state.minRaise = diff;
        state.currentBet = player.roundBet;
        state.players.forEach(other => {
          if (other.id !== player.id && !other.folded && !other.allIn) {
            other.actedThisStreet = false;
          }
        });
      }
      if (player.chips === 0) player.allIn = true;
      sfx.chip();
    }

    state.turnIndex = (state.turnIndex + 1) % 5;
    advanceToValidTurn();
  }

  function runAiTurn(ai) {
    if (state.phase !== 'betting') return;
    const toCall = Math.max(0, state.currentBet - ai.roundBet);
    const evalRes = evaluateBestHand([...ai.cards, ...state.community]);
    const cat = evalRes.score[0];
    const highRank = Math.max(ai.cards[0].rank, ai.cards[1].rank);
    const isPocketPair = ai.cards[0].rank === ai.cards[1].rank;

    let strength = cat * 20 + highRank;
    if (state.street === 'preflop' && isPocketPair) strength += 24;
    const roll = Math.random();

    if (toCall === 0) {
      if ((strength >= 32 || roll < 0.22) && ai.chips >= BB_AMOUNT) {
        const raiseAmt = Math.min(ai.chips, BB_AMOUNT * (strength >= 55 ? 3 : 2));
        commitAction(ai, 'raise', ai.roundBet + raiseAmt);
      } else {
        commitAction(ai, 'check');
      }
    } else {
      const potOdds = toCall / Math.max(1, state.pot + toCall);
      if (toCall > ai.chips * 0.45 && strength < 30 && roll > 0.2) {
        commitAction(ai, 'fold');
      } else if (potOdds > 0.35 && strength < 24 && roll > 0.3) {
        commitAction(ai, 'fold');
      } else if ((strength >= 50 || (strength >= 35 && roll < 0.25)) && ai.chips > toCall + state.minRaise && state.currentBet < 1500) {
        commitAction(ai, 'raise', state.currentBet + state.minRaise);
      } else {
        commitAction(ai, 'call');
      }
    }
  }

  function openSettlementOverlay(titleText) {
    $('settlementTitle').textContent = titleText;
    $('settlementSub').textContent = `第 ${state.handNumber} 局輸贏盤點`;
    $('settlePotText').textContent = `$${state.pot.toLocaleString()}`;

    if (state.community.length > 0) {
      $('settleCommCards').innerHTML = state.community.map(c => cardHTML(c, 'sm', false)).join('');
    } else {
      $('settleCommCards').innerHTML = '<span class="text-[11px] text-slate-500">翻牌前結束（無公牌）</span>';
    }

    const rowsHtml = state.players.map(p => {
      const isWin = state.winnerIds.has(p.id);
      const deltaStr = p.netDelta > 0 ? `+$${p.netDelta.toLocaleString()}` : p.netDelta < 0 ? `-$${Math.abs(p.netDelta).toLocaleString()}` : '$0';
      const deltaColor = isWin ? 'text-emerald-300' : p.netDelta < 0 ? 'text-rose-400' : 'text-slate-400';
      const statusBadge = isWin
        ? '<span class="px-1.5 py-0.5 rounded bg-amber-400 text-slate-950 font-black text-[10px]">贏家</span>'
        : p.folded
          ? '<span class="px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 font-bold text-[10px]">棄牌</span>'
          : '<span class="px-1.5 py-0.5 rounded bg-rose-950 text-rose-300 border border-rose-700/50 font-bold text-[10px]">落敗</span>';
      const cardsHtml = p.cards.map(c => cardHTML(c, 'sm', false)).join('');
      return `
        <div class="flex items-center justify-between gap-2 p-2 rounded-xl border ${isWin ? 'bg-amber-500/10 border-amber-400/50' : 'bg-slate-800/60 border-slate-700/60'}">
          <div class="flex items-center gap-2 min-w-0">
            <div class="flex items-center gap-0.5 shrink-0">${cardsHtml}</div>
            <div class="min-w-0">
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-xs ${p.isHuman ? 'text-cyan-300' : 'text-white'} truncate">${p.name}</span>
                ${statusBadge}
              </div>
              <div class="text-[10px] text-slate-400">
                投入: $${p.totalBet.toLocaleString()} ${p.handName ? `• <span class="text-amber-300 font-semibold">${p.handName}</span>` : ''}
              </div>
            </div>
          </div>
          <div class="text-right shrink-0">
            <div class="text-xs sm:text-sm font-black ${deltaColor}">${deltaStr}</div>
            <div class="text-[10px] text-slate-400">餘額 $${p.chips.toLocaleString()}</div>
          </div>
        </div>
      `;
    }).join('');

    $('settlementRows').innerHTML = rowsHtml;
    const humanBusted = state.players[0].chips <= 0;
    $('btnSettleNext').classList.toggle('hidden', humanBusted);
    $('btnSettleRebuy').classList.toggle('hidden', !humanBusted);

    $('settlementModal').classList.remove('hidden');
    $('settlementModal').classList.add('flex');
  }

  function finishHandEarly(winner) {
    state.phase = 'showdown';
    state.street = 'showdown';
    winner.chips += state.pot;
    state.winnerIds = new Set([winner.id]);
    state.players.forEach(p => {
      const won = p.id === winner.id ? state.pot : 0;
      p.netDelta = won - p.totalBet;
      p.handName = '';
    });
    const sign = winner.netDelta >= 0 ? `+$${winner.netDelta}` : `-$${Math.abs(winner.netDelta)}`;
    const summary = `🏆 ${winner.name} 勝 (${sign})`;
    $('showdownBanner').textContent = summary;
    $('showdownBanner').classList.remove('hidden');
    sfx.win();
    renderAll();
    setTimeout(() => openSettlementOverlay(summary), 420);
  }

  function runShowdown() {
    state.phase = 'showdown';
    state.street = 'showdown';

    const evalMap = new Map();
    state.players.forEach(p => {
      if (!p.folded) {
        const res = evaluateBestHand([...p.cards, ...state.community]);
        evalMap.set(p.id, res);
        p.handName = res.name;
      } else {
        p.handName = '';
      }
    });

    const levels = [...new Set(state.players.map(p => p.totalBet).filter(v => v > 0))].sort((a, b) => a - b);
    const payouts = new Map(state.players.map(p => [p.id, 0]));
    let prev = 0;

    for (const lvl of levels) {
      const slicePlayers = state.players.filter(p => p.totalBet >= lvl);
      const slicePot = (lvl - prev) * slicePlayers.length;
      const eligible = slicePlayers.filter(p => !p.folded);

      if (eligible.length > 0 && slicePot > 0) {
        let bestScore = null;
        let winners = [];
        for (const p of eligible) {
          const s = evalMap.get(p.id).score;
          if (!bestScore || compareScores(s, bestScore) > 0) {
            bestScore = s;
            winners = [p];
          } else if (compareScores(s, bestScore) === 0) {
            winners.push(p);
          }
        }
        const share = Math.floor(slicePot / winners.length);
        let rem = slicePot - share * winners.length;
        for (const w of winners) {
          const bonus = rem > 0 ? 1 : 0;
          if (rem > 0) rem--;
          payouts.set(w.id, payouts.get(w.id) + share + bonus);
        }
      }
      prev = lvl;
    }

    const winSummaries = [];
    state.players.forEach(p => {
      const won = payouts.get(p.id) || 0;
      p.netDelta = won - p.totalBet;
      if (won > 0) {
        p.chips += won;
        state.winnerIds.add(p.id);
        const netStr = p.netDelta >= 0 ? `+$${p.netDelta}` : `-$${Math.abs(p.netDelta)}`;
        winSummaries.push(`${p.name} ${p.handName} (${netStr})`);
      }
    });

    const summary = `🏆 ${winSummaries.join(' / ')}`;
    $('showdownBanner').textContent = summary;
    $('showdownBanner').classList.remove('hidden');
    sfx.win();
    renderAll();
    setTimeout(() => openSettlementOverlay(summary), 480);
  }

  // ===== Clean, Clutter-Free Seat & Table Rendering =====
  function renderSeat(p) {
    const el = $(`seat-${p.id}`);
    const isTurn = state.phase === 'betting' && state.turnIndex === p.id;
    const isWinner = state.winnerIds.has(p.id);

    el.className = `seat-node rounded-xl p-1.5 absolute z-10 ${isTurn ? 'active-turn' : ''} ${isWinner ? 'winner-glow' : ''} ${p.folded ? 'folded' : ''}`;

    const showFaceUp = p.isHuman || (state.phase === 'showdown' && !p.folded && state.players.filter(x => !x.folded).length > 1);
    const cardsHtml = p.cards.map(c => cardHTML(c, 'sm', !showFaceUp)).join('');

    let rightBadge = '';
    if (state.phase === 'showdown') {
      const isWin = state.winnerIds.has(p.id);
      const deltaStr = p.netDelta > 0 ? `+$${p.netDelta}` : p.netDelta < 0 ? `-$${Math.abs(p.netDelta)}` : '$0';
      const deltaClass = isWin
        ? 'bg-emerald-500/25 text-emerald-300 border-emerald-400/50'
        : p.netDelta < 0
          ? 'bg-rose-500/25 text-rose-300 border-rose-400/50'
          : 'bg-slate-800 text-slate-400 border-slate-700';
      const tag = isWin ? '勝' : p.folded ? '棄' : '敗';
      rightBadge = `
        <div class="flex flex-col items-end leading-tight gap-0.5">
          <span class="px-1.5 py-0.5 rounded border text-[9px] font-extrabold ${deltaClass}">${tag} ${deltaStr}</span>
          ${p.handName ? `<span class="text-[8.5px] font-bold text-amber-300">${p.handName}</span>` : ''}
        </div>
      `;
    } else if (p.roundBet > 0) {
      rightBadge = `<span class="px-1.5 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-400/40 text-[9px] font-bold">$${p.roundBet}</span>`;
    }

    el.innerHTML = `
      <div class="flex items-center justify-between gap-1 mb-1">
        <span class="font-bold text-[10px] sm:text-[11px] truncate ${p.isHuman ? 'text-cyan-300' : 'text-white'}">${p.name}</span>
        <span class="text-[10px] sm:text-[11px] font-extrabold text-emerald-300">$${p.chips.toLocaleString()}</span>
      </div>
      <div class="flex items-center justify-between gap-1 min-h-[34px]">
        <div class="flex items-center gap-0.5">${cardsHtml}</div>
        ${rightBadge}
      </div>
    `;
  }

  function renderAll() {
    layoutCircularTable();
    state.players.forEach(renderSeat);

    $('potBadge').textContent = `$${state.pot.toLocaleString()}`;

    const commHtml = [];
    for (let i = 0; i < 5; i++) {
      if (state.community[i]) {
        commHtml.push(cardHTML(state.community[i], 'lg', false));
      } else {
        commHtml.push(`<div class="poker-card lg border border-dashed border-emerald-300/25 bg-black/20 shadow-none"></div>`);
      }
    }
    $('communityCards').innerHTML = commHtml.join('');

    const human = state.players[0];
    const isHumanTurn = state.phase === 'betting' && state.turnIndex === 0 && !human.folded;
    const toCall = Math.max(0, state.currentBet - human.roundBet);

    $('btnFold').disabled = !isHumanTurn;
    $('btnCheckCall').disabled = !isHumanTurn;
    $('btnCheckCall').textContent = toCall === 0 ? '過牌' : `跟注 $${Math.min(human.chips, toCall)}`;

    const canRaise = isHumanTurn && human.chips > toCall;
    $('btnRaise').disabled = !canRaise;
    $('raiseBox').classList.toggle('opacity-40', !canRaise);
    $('raiseBox').classList.toggle('pointer-events-none', !canRaise);

    if (canRaise) {
      const minTotal = Math.min(human.roundBet + human.chips, state.currentBet + state.minRaise);
      const maxTotal = human.roundBet + human.chips;
      const slider = $('raiseSlider');
      slider.min = minTotal;
      slider.max = maxTotal;
      if (Number(slider.value) < minTotal || Number(slider.value) > maxTotal) {
        slider.value = minTotal;
      }
      $('raiseAmountText').textContent = `$${slider.value}`;
    }

    const isShowdown = state.phase === 'showdown';
    $('nextHandBar').classList.toggle('hidden', !isShowdown);
    $('btnNextHand').classList.toggle('hidden', human.chips <= 0);
    $('btnRebuy').classList.toggle('hidden', human.chips > 0);
  }

  // ===== Event Listeners =====
  $('btnFold').addEventListener('click', () => commitAction(state.players[0], 'fold'));
  $('btnCheckCall').addEventListener('click', () => {
    const human = state.players[0];
    const toCall = Math.max(0, state.currentBet - human.roundBet);
    commitAction(human, toCall === 0 ? 'check' : 'call');
  });
  $('btnRaise').addEventListener('click', () => {
    commitAction(state.players[0], 'raise', Number($('raiseSlider').value));
  });
  $('raiseSlider').addEventListener('input', (e) => {
    $('raiseAmountText').textContent = `$${e.target.value}`;
  });
  document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const slider = $('raiseSlider');
      const minV = Number(slider.min);
      const maxV = Number(slider.max);
      let val = minV;
      const p = btn.dataset.preset;
      if (p === 'half') val = Math.max(minV, Math.floor(state.currentBet + state.pot * 0.5));
      if (p === 'pot') val = Math.max(minV, state.currentBet + state.pot);
      if (p === 'allin') val = maxV;
      val = Math.min(maxV, Math.round(val / 50) * 50);
      slider.value = val;
      $('raiseAmountText').textContent = `$${val}`;
    });
  });

  $('btnNextHand').addEventListener('click', startNewHand);
  $('btnRebuy').addEventListener('click', () => {
    state.players[0].chips = STARTING_CHIPS;
    startNewHand();
  });
  $('btnNewTable').addEventListener('click', initTable);

  $('btnSound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    $('btnSound').textContent = soundEnabled ? '🔊 音效' : '🔇 靜音';
  });

  $('btnBgm').addEventListener('click', () => {
    bgmEnabled = !bgmEnabled;
    $('btnBgm').textContent = bgmEnabled ? '🎵 音樂' : '🔇 音樂';
    if (bgmEnabled) startSnookerBgm();
  });

  $('btnStartGame').addEventListener('click', () => {
    $('homeScreen').classList.add('hidden');
    startSnookerBgm();
    initTable();
  });

  $('btnCloseSettlement').addEventListener('click', () => {
    $('settlementModal').classList.add('hidden');
    $('settlementModal').classList.remove('flex');
  });

  $('btnSettleNext').addEventListener('click', () => {
    $('settlementModal').classList.add('hidden');
    $('settlementModal').classList.remove('flex');
    startNewHand();
  });

  $('btnSettleRebuy').addEventListener('click', () => {
    $('settlementModal').classList.add('hidden');
    $('settlementModal').classList.remove('flex');
    state.players[0].chips = STARTING_CHIPS;
    startNewHand();
  });

  $('btnRules').addEventListener('click', () => {
    const list = [...HAND_NAMES].reverse().map((name, i) => `
      <div class="flex justify-between py-1.5 border-b border-slate-800 text-xs">
        <span class="font-bold text-cyan-300">#${i + 1} ${name}</span>
      </div>
    `).join('');
    $('modalBody').innerHTML = list;
    $('modalBackdrop').classList.remove('hidden');
    $('modalBackdrop').classList.add('flex');
  });

  $('modalClose').addEventListener('click', () => {
    $('modalBackdrop').classList.add('hidden');
    $('modalBackdrop').classList.remove('flex');
  });
  $('modalBackdrop').addEventListener('click', (e) => {
    if (e.target === $('modalBackdrop')) {
      $('modalBackdrop').classList.add('hidden');
      $('modalBackdrop').classList.remove('flex');
    }
  });

  window.addEventListener('resize', layoutCircularTable);
  window.onload = () => {
    layoutCircularTable();
  };
})();
</script>
</body>
</html>
